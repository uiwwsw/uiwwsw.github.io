<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Room · uiwwsw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        background: radial-gradient(circle at 20% 20%, #0e1624, #050811 55%);
        color: #c7d2fe;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 18px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: fixed;
        z-index: 10;
        width: 100%;
        pointer-events: none;
      }
      header .badge {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 999px;
        padding: 10px 16px;
        backdrop-filter: blur(8px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        pointer-events: all;
      }
      header .badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7c3aed;
        box-shadow: 0 0 16px #8b5cf6;
      }
      header .links {
        display: inline-flex;
        gap: 12px;
        pointer-events: all;
      }
      header a {
        color: #a5b4fc;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #root {
        width: 100%;
        height: 100vh;
      }
      footer {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 13px;
        color: #9ca3af;
        letter-spacing: 0.01em;
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
    </style>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <header>
      <div class="badge">
        <span class="dot"></span>
        <div>
          <div style="font-weight: 700; color: #cbd5ff">uiwwsw</div>
          <div style="font-size: 12px; color: #9fb0ff">Matthew Yoon · Frontend Developer</div>
        </div>
      </div>
      <div class="links">
        <a href="https://github.com/uiwwsw" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:uiwwsw@icloud.com">Contact</a>
      </div>
    </header>
    <div id="root"></div>
    <footer>React · drei · three.js · GitHub Pages</footer>

    <script type="text/babel" data-type="module">
      import React, { useMemo, useRef } from 'https://cdn.jsdelivr.net/npm/react@18.3.1/+esm';
      import { createRoot } from 'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm';
      import { Canvas, useFrame } from 'https://cdn.jsdelivr.net/npm/@react-three/fiber@9.0.0/+esm';
      import {
        OrbitControls,
        Sparkles,
        Float,
        Text,
        Html,
        ContactShadows,
        Environment,
        EffectComposer,
        Bloom,
      } from 'https://cdn.jsdelivr.net/npm/@react-three/drei@9.105.5/+esm';
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/+esm';

      const NeonSign = ({ position }) => {
        const glow = new THREE.Color('#7c3aed');
        const neon = new THREE.Color('#a855f7');
        return (
          <Float speed={1.2} rotationIntensity={0.35} floatIntensity={0.6} position={position}>
            <group>
              <Text
                fontSize={0.32}
                color={neon}
                position={[0, 0.1, 0]}
                letterSpacing={0.02}
                material-toneMapped={false}
              >
                uiwwsw
                <meshBasicMaterial color={neon} />
              </Text>
              <Text
                fontSize={0.18}
                color={glow}
                position={[0, -0.18, 0]}
                letterSpacing={0.04}
                material-toneMapped={false}
              >
                Frontend Developer
                <meshBasicMaterial color={glow} />
              </Text>
            </group>
          </Float>
        );
      };

      const DeskSet = () => {
        const monitorRef = useRef();
        useFrame(({ clock }) => {
          const t = clock.getElapsedTime();
          if (monitorRef.current) {
            monitorRef.current.emissiveIntensity = 1.4 + Math.sin(t * 2) * 0.2;
          }
        });
        return (
          <group position={[0, 0, 0]}>
            <mesh position={[0, 0.36, 0]}>
              <boxGeometry args={[2.4, 0.1, 1.1]} />
              <meshStandardMaterial color="#111827" metalness={0.2} roughness={0.4} />
            </mesh>
            {[ -1, 1 ].map((x) => (
              <mesh key={x} position={[x, 0.18, -0.45]}>
                <boxGeometry args={[0.12, 0.36, 0.12]} />
                <meshStandardMaterial color="#0f172a" roughness={0.5} />
              </mesh>
            ))}
            <mesh position={[0, 0.18, 0.45]}>
              <boxGeometry args={[0.12, 0.36, 0.12]} />
              <meshStandardMaterial color="#0f172a" roughness={0.5} />
            </mesh>

            <group position={[0, 0.78, -0.15]}>
              <mesh position={[0, 0.15, 0]}>
                <boxGeometry args={[0.8, 0.5, 0.05]} />
                <meshStandardMaterial color="#0b1220" metalness={0.1} roughness={0.4} />
              </mesh>
              <mesh position={[0, 0.38, -0.12]}>
                <boxGeometry args={[0.7, 0.05, 0.25]} />
                <meshStandardMaterial color="#0a162b" metalness={0.2} roughness={0.35} />
              </mesh>
              <mesh position={[0, 0.35, 0.12]}>
                <boxGeometry args={[0.7, 0.4, 0.01]} />
                <meshStandardMaterial
                  ref={monitorRef}
                  color="#6ee7ff"
                  emissive="#7c3aed"
                  emissiveIntensity={1.4}
                  toneMapped={false}
                />
              </mesh>
            </group>

            <mesh position={[0, 0.45, 0.35]}>
              <boxGeometry args={[0.78, 0.06, 0.3]} />
              <meshStandardMaterial color="#111827" roughness={0.5} />
            </mesh>
            <mesh position={[0.05, 0.47, 0.35]}>
              <boxGeometry args={[0.68, 0.04, 0.22]} />
              <meshStandardMaterial color="#0ea5e9" emissive="#38bdf8" emissiveIntensity={0.35} />
            </mesh>

            <group position={[0.15, 0.21, 0.9]}>
              <mesh position={[0, 0.26, -0.2]}> 
                <cylinderGeometry args={[0.12, 0.1, 0.5, 24]} />
                <meshStandardMaterial color="#0b1220" roughness={0.35} metalness={0.2} />
              </mesh>
              <mesh position={[0, 0.5, 0]}>
                <boxGeometry args={[0.5, 0.08, 0.5]} />
                <meshStandardMaterial color="#0f172a" />
              </mesh>
              <mesh position={[0, 0.6, 0]} rotation={[0.2, 0, 0]}>
                <boxGeometry args={[0.55, 0.05, 0.55]} />
                <meshStandardMaterial color="#111827" />
              </mesh>
            </group>
          </group>
        );
      };

      const Room = () => {
        const rig = useRef();
        useFrame(({ clock }) => {
          const t = clock.getElapsedTime() * 0.2;
          if (rig.current) {
            rig.current.rotation.y = t;
          }
        });

        const wallMaterial = useMemo(() => new THREE.MeshStandardMaterial({ color: '#0b1020', roughness: 0.9, metalness: 0.05 }), []);

        return (
          <group>
            <Sparkles count={120} speed={0.6} opacity={0.4} scale={6} size={6} color="#60a5fa" />
            <group position={[0, -0.02, 0]}>
              <mesh receiveShadow rotation={[-Math.PI / 2, 0, 0]}>
                <planeGeometry args={[8, 8]} />
                <meshStandardMaterial color="#050910" roughness={0.95} />
              </mesh>
              <mesh position={[0, 2, -4]} material={wallMaterial}>
                <boxGeometry args={[8, 4, 0.2]} />
              </mesh>
              <mesh position={[4, 2, 0]} rotation={[0, -Math.PI / 2, 0]} material={wallMaterial}>
                <boxGeometry args={[8, 4, 0.2]} />
              </mesh>
              <mesh position={[-4, 2, 0]} rotation={[0, Math.PI / 2, 0]} material={wallMaterial}>
                <boxGeometry args={[8, 4, 0.2]} />
              </mesh>
            </group>

            <group ref={rig} position={[0, 0, 0]}>
              <DeskSet />
              <NeonSign position={[0, 2.2, -1]} />
              <Float speed={1.2} floatIntensity={0.5} position={[1.6, 1, 0.4]}>
                <mesh>
                  <boxGeometry args={[0.4, 0.6, 0.12]} />
                  <meshStandardMaterial color="#0ea5e9" emissive="#14b8a6" emissiveIntensity={0.8} metalness={0.2} roughness={0.25} />
                </mesh>
                <Html center distanceFactor={12} style={{ color: '#dbeafe', fontSize: '12px', fontWeight: 600 }}>
                  Project Card
                </Html>
              </Float>
              <Float speed={0.8} floatIntensity={0.4} position={[-1.5, 1.3, 0.2]}>
                <mesh>
                  <boxGeometry args={[0.3, 0.3, 0.3]} />
                  <meshStandardMaterial color="#f472b6" emissive="#e879f9" emissiveIntensity={0.6} />
                </mesh>
              </Float>
              <ContactShadows position={[0, -0.01, 0]} blur={2.4} opacity={0.4} scale={8} far={2} />
            </group>
          </group>
        );
      };

      const Scene = () => (
        <Canvas camera={{ position: [4.5, 2.5, 5], fov: 40 }} shadows>
          <color attach="background" args={[ '#020710' ]} />
          <fog attach="fog" args={[ '#020710', 6, 14 ]} />
          <ambientLight intensity={0.35} />
          <spotLight
            position={[6, 6, 4]}
            angle={0.55}
            intensity={2.5}
            penumbra={0.8}
            castShadow
            color="#8b5cf6"
          />
          <rectAreaLight
            position={[0, 3, 2]}
            intensity={12}
            width={4}
            height={2}
            color="#0ea5e9"
          />
          <Environment preset="city" />
          <Room />
          <OrbitControls enablePan={false} autoRotate autoRotateSpeed={0.4} maxPolarAngle={Math.PI / 2.2} />
          <EffectComposer disableNormalPass>
            <Bloom luminanceThreshold={0.1} luminanceSmoothing={0.6} intensity={1.1} mipmapBlur radius={0.9} />
          </EffectComposer>
        </Canvas>
      );

      createRoot(document.getElementById('root')).render(
        <React.StrictMode>
          <Scene />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
