name: Monthly Data Update

on:
  schedule:
    # Run at 00:17 UTC on the 1st of each month (9:17 AM KST)
    # Avoids the top-of-hour window where scheduled jobs are more likely to be delayed.
    - cron: '17 0 1 * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: npm run refresh-content

      - name: Detect content changes
        id: content_changes
        run: |
          git add src/data/velog-words.json src/data/velog-context.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Commit and Push Changes
        if: steps.content_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Velog archive data"
          git push

      - name: Configure GitHub Pages
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
