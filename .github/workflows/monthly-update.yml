name: Weekly Data Update

on:
  schedule:
    # Every Monday at 00:17 UTC (09:17 KST). Profile follows at 09:47 KST.
    # Avoids the top-of-hour window where scheduled jobs are more likely to be delayed.
    - cron: '17 0 * * 1'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize with normal deployments so a refresh cannot publish an older build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # main is protected, so refreshed data is not committed. Each refresh is
      # kept in the Actions cache; deploy.yml restores the newest one.
      - name: Restore latest refreshed archive data
        uses: actions/cache/restore@v4
        with:
          path: |
            src/data/velog-words.json
            src/data/velog-context.json
            src/data/sky-registry.json
          key: velog-data-none
          restore-keys: velog-data-

      - name: Run Scraper
        run: npm run refresh-content

      - name: Detect content changes
        id: content_changes
        run: |
          git add src/data/velog-words.json src/data/velog-context.json src/data/sky-registry.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm test && npm run build

      - name: Keep refreshed archive data for later deploys
        if: steps.content_changes.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/data/velog-words.json
            src/data/velog-context.json
            src/data/sky-registry.json
          key: velog-data-${{ github.run_id }}

      - name: Configure GitHub Pages
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.content_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: deployment
        uses: actions/deploy-pages@v4
