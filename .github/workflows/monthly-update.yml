name: Monthly Data Update

on:
  schedule:
    # Run at 00:00 UTC on the 1st of each month (9:00 AM KST)
    - cron: '0 0 1 * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper
        run: npm run refresh-content

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add src/data/velog-words.json src/data/velog-context.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh Velog archive data"
            git push
          fi
