    <!-- Optimize favicon loading -->

    <link rel="icon" type="image/png" sizes="32x32" href="/universe.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/universe.png" />
    <link rel="apple-touch-icon" href="/universe.png" />
    <link rel="shortcut icon" href="/universe.png" />

    <!-- Local font: SUITE Variable -->

    <!-- Critical CSS inline -->

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
      }
      body {
        margin: 0;
        background: #03060c;
        color: #e9e9e7;
        overflow: hidden;
      }
    </style>

    <!-- Mobile optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uiwwsw.github.io/" />
    <meta property="og:title" content="uiwwsw — 기록이 별이 되는 우주" />

      content="달에서 지구까지. 코드를 쓰고 생각을 쓰는 개발자, uiwwsw의 작은 우주."

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />

  <body>
    <div id="root"></div>
    <noscript
      >이 우주를 탐험하려면 JavaScript가 필요합니다.
      <a href="https://velog.io/@uiwwsw/posts"
        >벨로그에서 모든 글 읽기</a
      ></noscript
    >
    <script type="module" src="./main.jsx"></script>

    <!-- Service Worker Registration -->
    <script type="module">
      if (import.meta.env.PROD && "serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const swUrl = `${import.meta.env.BASE_URL}sw.js?v=__SW_VERSION__`;

          navigator.serviceWorker
            .register(swUrl, { updateViaCache: "none" })
            .then((registration) => {
              registration.update();
              console.log("SW registered: ", registration);
            })
            .catch((registrationError) => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      }
    </script>
  </body>
</html>
